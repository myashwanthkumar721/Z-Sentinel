services:

  z-sentinel:
    build: .
    container_name: z-sentinel

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./database:/app/database

    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      API_HOST: 0.0.0.0
      API_PORT: 8000